
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Media Upload Test</title>
</head>
<body>
  <h2>Media Upload Test</h2>

<input
  type="file"
  id="file"
  accept="image/jpeg,image/png,video/mp4,video/webm,video/quicktime"
/>  <button onclick="uploadMedia()">Upload Image</button>

  <pre id="result"></pre>

  <script>
    async function uploadMedia() {
      const file = document.getElementById("file").files[0];
      const output = document.getElementById("result");

      if (!file) {
        output.textContent = "Please select an image";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("/api/media", {
          method: "POST",
          body: formData,
          credentials: "same-origin",
        });

        output.textContent =
          "HTTP Status: " + response.status + "\n" +
          JSON.stringify(await response.json(), null, 2);
      } catch (error) {
        output.textContent = "Error: " + error.message;
      }
    }
  </script>

  
<hr />

<h3>Update Image Metadata</h3>

<button onclick="testMetadataUpdate()">
  Update Metadata
</button>

<pre id="metadata-result"></pre>

<script>
  async function testMetadataUpdate() {
    const mediaId = "4b5dae4e-3b23-4054-aa6f-291b480298b4";

    const output = document.getElementById("metadata-result");

    try {
      const response = await fetch(`/api/media/${mediaId}`, {
        method: "PATCH",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          alt_text: "Brown leather jacket",
          caption: "Men's leather jacket",
          description: "Image used in a leather jacket blog post",
        }),
      });

      output.textContent =
        "HTTP Status: " + response.status + "\n" +
        JSON.stringify(await response.json(), null, 2);
    } catch (error) {
      output.textContent = "Error: " + error.message;
    }
  }
</script>

<hr />

<h3>Delete Test Media</h3>

<button onclick="testMediaDelete()">
  Delete Test Image
</button>

<pre id="delete-result"></pre>

<script>
  async function testMediaDelete() {
    // Temporary PNG image uploaded during testing.
    const mediaId = "9c330bee-0567-4e55-a69e-819a369c7daa";

    const confirmed = window.confirm(
      "Are you sure you want to delete this media? This action cannot be undone."
    );

    if (!confirmed) return;

    const output = document.getElementById("delete-result");

    try {
      const response = await fetch(`/api/media/${mediaId}`, {
        method: "DELETE",
        credentials: "same-origin",
      });

      output.textContent =
        "HTTP Status: " + response.status + "\n" +
        JSON.stringify(await response.json(), null, 2);
    } catch (error) {
      output.textContent = "Error: " + error.message;
    }
  }
</script>

</body>
</html>
